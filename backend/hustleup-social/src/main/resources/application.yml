spring:
  application:
    name: hustleup-social
  servlet:
    multipart:
      max-file-size: 500MB
      max-request-size: 500MB
  datasource:
    url: jdbc:mysql://localhost:3306/hustleup?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: root
    password: ${MYSQL_PASSWORD}
  # Schema is owned by Flyway (migrations live in hustleup-common, since all services
  # share one database). baseline-on-migrate records the pre-existing Hibernate-built
  # Baselined at 11, above every pre-existing migration. Those V1-V11 files were never
  # applied: Flyway was not a dependency and was never configured, so the live schema was
  # built by Hibernate instead. They are also unguarded — V1 does a bare CREATE TABLE
  # users, V8 a bare ADD COLUMN — so running them against the schema that already exists
  # would fail on the first statement. Baselining above them means they never execute,
  # and only V12 onward applies.
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 11
  jpa:
    hibernate:
      # validate, not update: Hibernate no longer changes the schema, it only checks that
      # the entities match what Flyway produced. A mismatch is then a loud startup failure
      # instead of a silent, undocumented column appearing in production.
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        type:
          preferred_uuid_jdbc_type: VARCHAR
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      connect-timeout: 2s
      timeout: 2s
  cache:
    type: ${CACHE_TYPE:redis}
    redis:
      time-to-live: 60000
      cache-null-values: false
  kafka:
    bootstrap-servers: ${KAFKA_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      retries: 0
      properties:
        max.block.ms: 500
        request.timeout.ms: 1000
        delivery.timeout.ms: 1500
    admin:
      fail-fast: false

server:
  port: 8082

sentry:
  dsn: ${SENTRY_DSN:}
  environment: ${SENTRY_ENV:development}
  traces-sample-rate: 0.2

app:
  jwt:
    secret: ${JWT_SECRET}
    access-token-expiration-ms: 900000
    refresh-token-expiration-ms: 604800000
  stories:
    expiration-hours: 24
  news:
    # Outlets aggregated into the news page, as comma-separated "Name|url|category" entries.
    #
    # url may be a feed URL or the outlet's homepage — the reader discovers the feed from
    # the page's <link rel="alternate"> tag, so a homepage is fine when the feed path is
    # unknown or looks likely to move.
    #
    # category is a section id from the news page's own list: lublin, students,
    # immigration, housing, poland, opportunity, event, regulation, business, tech. It is
    # only the fallback — NewsCategoryMapper files individual articles by what they are
    # about, so a visa story from a Lublin outlet still lands under "Visas & residence".
    #
    # The defaults below were each fetched and confirmed to serve a valid feed:
    #   - Five channels from lublin.eu, the Lublin city portal's own RSS (the full list of
    #     20 is at https://lublin.eu/kanaly-rss/ — education, culture, business and the two
    #     general news channels are the ones this audience reads).
    #   - Notes from Poland, an English-language Poland desk — the one source here an
    #     international student can read on day one, before any Polish.
    #
    # Override with NEWS_SOURCES to add or drop outlets without a rebuild; set it to a
    # single space to turn aggregation off entirely. After changing it, POST
    # /api/v1/news/import as an admin to fetch immediately and see per-source success and
    # failure counts rather than waiting for the next 30-minute poll.
    # Single-quoted for YAML (the value carries ":" and "|"); no quotes inside the
    # ${...:default} expression, which would otherwise land in the string literally.
    # Outlet names are the byline readers see, so they are in English rather than Polish —
    # this audience is largely international, and it keeps the value pure ASCII so nothing
    # is mangled passing through an env var or a Docker file.
    sources: '${NEWS_SOURCES:Lublin City|https://lublin.eu/rss/pl/66/2.xml|lublin,Lublin Residents|https://lublin.eu/rss/pl/464/2.xml|lublin,Lublin Education|https://lublin.eu/rss/pl/1082/2.xml|students,Lublin Culture|https://lublin.eu/rss/pl/41/2.xml|event,Lublin Business|https://lublin.eu/rss/pl/791/2.xml|business,Notes from Poland|https://notesfrompoland.com/feed/|poland}'
    # Imported articles are pruned after this many days. Native articles are never pruned.
    retention-days: ${NEWS_RETENTION_DAYS:45}
  upload:
    dir: ${UPLOAD_DIR:./uploads}
  aws:
    access-key: ${AWS_ACCESS_KEY_ID:}
    secret-key: ${AWS_SECRET_ACCESS_KEY:}
    region: ${AWS_REGION:us-east-1}
    s3:
      bucket: ${AWS_S3_BUCKET:hustle-up}
  cdn:
    domain: ${CDN_DOMAIN:}
