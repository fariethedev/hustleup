spring:
  # ── SMTP (hustlespace.space mailbox hosting) ──────────────────────────────
  # Host/credentials come from the environment so the mailbox password never lands
  # in the repo. With MAIL_HOST unset, EmailService logs messages instead of sending,
  # which is the intended local-development behaviour.
  mail:
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${MAIL_AUTH:true}
          # STARTTLS on 587. For implicit TLS on 465 set MAIL_PORT=465 and
          # MAIL_SSL_ENABLE=true (which flips the ssl.enable flag below).
          starttls:
            enable: ${MAIL_STARTTLS:true}
          ssl:
            enable: ${MAIL_SSL_ENABLE:false}
          connectiontimeout: 10000
          timeout: 10000
          writetimeout: 10000
  application:
    name: hustleup-marketplace
  servlet:
    multipart:
      max-file-size: 500MB
      max-request-size: 500MB
  datasource:
    url: jdbc:mysql://localhost:3306/hustleup?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: root
    password: ${MYSQL_PASSWORD}
  # Schema is owned by Flyway (migrations live in hustleup-common, since all services
  # share one database). baseline-on-migrate records the pre-existing Hibernate-built
  # Baselined at 11, above every pre-existing migration. Those V1-V11 files were never
  # applied: Flyway was not a dependency and was never configured, so the live schema was
  # built by Hibernate instead. They are also unguarded — V1 does a bare CREATE TABLE
  # users, V8 a bare ADD COLUMN — so running them against the schema that already exists
  # would fail on the first statement. Baselining above them means they never execute,
  # and only V12 onward applies.
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 11
  jpa:
    hibernate:
      # validate, not update: Hibernate no longer changes the schema, it only checks that
      # the entities match what Flyway produced. A mismatch is then a loud startup failure
      # instead of a silent, undocumented column appearing in production.
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        type:
          preferred_uuid_jdbc_type: VARCHAR

server:
  port: 8083

sentry:
  dsn: ${SENTRY_DSN:}
  environment: ${SENTRY_ENV:development}
  traces-sample-rate: 0.2

app:
  jwt:
    secret: ${JWT_SECRET}
    access-token-expiration-ms: 900000
    refresh-token-expiration-ms: 604800000
  upload:
    dir: ${UPLOAD_DIR:./uploads}
  stripe:
    secret-key: ${STRIPE_SECRET_KEY}
    # Separate webhook secret from the subscription service's — Connect events (account.updated,
    # payment_intent.*, transfer.*) are registered as their own Stripe webhook endpoint.
    connect-webhook-secret: ${STRIPE_CONNECT_WEBHOOK_SECRET:whsec_placeholder}
    # Platform's cut of each completed booking, as a percentage (e.g. 8 = 8%). The seller
    # receives agreedPrice minus this fee when a booking is marked COMPLETED.
    platform-fee-percent: ${STRIPE_PLATFORM_FEE_PERCENT:8}
  frontend:
    url: ${FRONTEND_URL:http://localhost:5174}
  aws:
    access-key: ${AWS_ACCESS_KEY_ID:}
    secret-key: ${AWS_SECRET_ACCESS_KEY:}
    region: ${AWS_REGION:us-east-1}
    s3:
      bucket: ${AWS_S3_BUCKET:hustle-up}
  cdn:
    domain: ${CDN_DOMAIN:}
  email:
    from: ${EMAIL_FROM:HustleSpace <notifications@hustlespace.space>}
  adzuna:
    # Aggregated job adverts for Poland. Free credentials at https://developer.adzuna.com —
    # register an app and it gives you an app_id and an app_key.
    #
    # Dormant when either is blank: the service starts normally and the jobs board simply
    # shows only natively posted adverts, exactly as it did before.
    app-id: ${ADZUNA_APP_ID:}
    app-key: ${ADZUNA_APP_KEY:}
    # Adzuna's country path segment. "pl" is Poland — the point of the integration.
    country: ${ADZUNA_COUNTRY:pl}
    # Fuzzy location match, so a city also pulls in the surrounding area. Blank = whole country.
    where: ${ADZUNA_WHERE:Lublin}
    # Pages per run, 50 adverts each.
    pages: ${ADZUNA_PAGES:4}
    # Imported adverts are dropped after this many days; natively posted ones are never pruned.
    retention-days: ${ADZUNA_RETENTION_DAYS:30}
  algolia:
    app-id: ${ALGOLIA_APP_ID:}
    admin-key: ${ALGOLIA_ADMIN_KEY:}
