# One-off: copies the Railway MySQL database into the new Aiven MySQL database.
# Manual trigger only, and it refuses to run unless you type the confirmation word,
# because it REPLACES every table in the target with the source's copy.
# Setup and secrets: backend/CLOUDFLARE_DEPLOYMENT.md, step 5.
name: Copy database (Railway → Aiven)

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "overwrite" to replace the target database contents'
        required: true

jobs:
  copy:
    if: inputs.confirm == 'overwrite'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SRC_HOST: ${{ secrets.SOURCE_MYSQL_HOST }}
      SRC_PORT: ${{ secrets.SOURCE_MYSQL_PORT }}
      SRC_USER: ${{ secrets.SOURCE_MYSQL_USER }}
      SRC_DB: ${{ secrets.SOURCE_MYSQL_DATABASE }}
      MYSQL_PWD_SRC: ${{ secrets.SOURCE_MYSQL_PASSWORD }}
      DST_HOST: ${{ secrets.TARGET_MYSQL_HOST }}
      DST_PORT: ${{ secrets.TARGET_MYSQL_PORT }}
      DST_USER: ${{ secrets.TARGET_MYSQL_USER }}
      DST_DB: ${{ secrets.TARGET_MYSQL_DATABASE }}
      MYSQL_PWD_DST: ${{ secrets.TARGET_MYSQL_PASSWORD }}
    steps:
      - name: Dump source
        run: |
          MYSQL_PWD="$MYSQL_PWD_SRC" mysqldump -h "$SRC_HOST" -P "$SRC_PORT" -u "$SRC_USER" \
            --single-transaction --routines --triggers --set-gtid-purged=OFF --no-tablespaces \
            "$SRC_DB" > dump.sql
          echo "Dump size: $(du -h dump.sql | cut -f1), tables: $(grep -c '^CREATE TABLE' dump.sql)"

      - name: Clear target tables
        # A fresh database may hold a half-built schema from a failed first boot (the
        # migrations cannot build the base tables from scratch), so start from empty.
        run: |
          DROPS=$(MYSQL_PWD="$MYSQL_PWD_DST" mysql -h "$DST_HOST" -P "$DST_PORT" -u "$DST_USER" --ssl-mode=REQUIRED -N \
            -e "SELECT CONCAT('DROP TABLE IF EXISTS \`', table_name, '\`;') FROM information_schema.tables WHERE table_schema='$DST_DB' AND table_type='BASE TABLE';")
          echo "Dropping $(echo "$DROPS" | grep -c DROP || true) tables"
          if [ -n "$DROPS" ]; then
            printf 'SET FOREIGN_KEY_CHECKS=0;\n%s\nSET FOREIGN_KEY_CHECKS=1;\n' "$DROPS" | \
              MYSQL_PWD="$MYSQL_PWD_DST" mysql -h "$DST_HOST" -P "$DST_PORT" -u "$DST_USER" --ssl-mode=REQUIRED "$DST_DB"
          fi

      - name: Restore into target
        run: |
          MYSQL_PWD="$MYSQL_PWD_DST" mysql -h "$DST_HOST" -P "$DST_PORT" -u "$DST_USER" \
            --ssl-mode=REQUIRED "$DST_DB" < dump.sql
          MYSQL_PWD="$MYSQL_PWD_DST" mysql -h "$DST_HOST" -P "$DST_PORT" -u "$DST_USER" \
            --ssl-mode=REQUIRED "$DST_DB" -e "SELECT COUNT(*) AS migrations FROM flyway_schema_history; SELECT COUNT(*) AS users FROM users;"

      - name: Remove dump
        if: always()
        run: rm -f dump.sql
