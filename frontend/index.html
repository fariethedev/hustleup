<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- The page is held at 1:1 on mobile: no pinch, no double-tap zoom. Android honours
         user-scalable/maximum-scale here; iOS Safari has ignored both since v10, so
         src/utils/lockViewport.js cancels the gestures directly. viewport-fit=cover lets
         the layout reach under the notch, which the safe-area insets already account for. -->
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="description" content="HustleSpace — The marketplace for hustlers. Buy, sell, trade, and connect with independent sellers, creators, and service providers." />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&family=Poppins:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <title>HustleSpace — The Marketplace for Hustlers</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
